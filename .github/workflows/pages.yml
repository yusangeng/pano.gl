# Deploys the demo site to GitHub Pages. This is independent of the library
# build (npm run build): the demo imports src/ directly and vite bundles it
# as a plain static site — see vite.demo.config.ts for that half.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['demo/**', 'src/**', 'vite.demo.config.ts', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  # Manual redeploy without a qualifying push (e.g. after switching the
  # Pages source or rotating secrets).
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait for the in-flight deployment
# instead of cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the version the demo build is verified against locally;
          # package.json engines allows >=20.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build:demo
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
